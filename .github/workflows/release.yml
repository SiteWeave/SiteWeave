name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: main
        clean: true
        # Full clone - avoids shallow clone possibly missing files
        fetch-depth: 0
        persist-credentials: false
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        # Disable cache to rule out stale dependency issues
        cache: ''

    - name: Verify source code is current
      shell: bash
      run: |
        echo "=== Tag: ${{ github.ref_name }} (release built from main) ==="
        echo "=== Commit: ${{ github.sha }} ==="
        echo "=== package.json version ==="
        node -e "console.log(require('./package.json').version)"
        echo "=== Verify vite.config.mjs alias points to index.js ==="
        if ! grep -q "packages/core-logic/src/index.js" vite.config.mjs; then
          echo "ERROR: vite.config.mjs must alias @siteweave/core-logic to packages/core-logic/src/index.js. Fix the alias and push to main."
          exit 1
        fi
        echo "OK: vite.config.mjs has correct core-logic alias"
        echo "=== Key source files exist ==="
        ls -la src/components/ProgressReportBuilder.jsx || echo "MISSING: ProgressReportBuilder.jsx"
        ls -la packages/core-logic/src/services/progressReportService.js || echo "MISSING: progressReportService.js"
        ls -la electron/main.cjs || echo "MISSING: electron/main.cjs"
        echo "=== Verify no stale dist-electron in checkout ==="
        if [ -f "dist-electron/main.cjs" ]; then
          echo "WARNING: Stale dist-electron/main.cjs found in checkout, removing..."
          rm -rf dist-electron/
        else
          echo "OK: No stale dist-electron/ in checkout"
        fi
        
    - name: Clean build directories
      shell: bash
      run: |
        echo "Removing any existing build artifacts and caches..."
        rm -rf dist/
        rm -rf dist-electron/
        rm -rf release/
        rm -rf node_modules/.vite
        echo "Build directories and Vite cache cleaned"

    - name: Verify package.json version matches tag
      shell: bash
      run: |
        TAG="${{ github.ref_name }}"
        EXPECTED_VERSION="${TAG#v}"
        ACTUAL_VERSION=$(node -e "console.log(require('./package.json').version)")
        if [ "$ACTUAL_VERSION" != "$EXPECTED_VERSION" ]; then
          echo "ERROR: Tag $TAG does not match package.json version $ACTUAL_VERSION."
          echo "Bump package.json to $EXPECTED_VERSION and push to main, then push the tag."
          exit 1
        fi
        echo "OK: package.json version $ACTUAL_VERSION matches tag $TAG"

    - name: Install dependencies
      run: npm ci
      
    - name: Build Windows executable
      run: npm run build:win
      env:
        VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
        VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
        VITE_MICROSOFT_CLIENT_ID: ${{ secrets.VITE_MICROSOFT_CLIENT_ID }}
        VITE_DROPBOX_APP_KEY: ${{ secrets.VITE_DROPBOX_APP_KEY }}
        ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/electron-builder-cache-${{ github.run_id }}

    - name: Verify build output
      shell: bash
      run: |
        echo "=== Checking dist/ (renderer) ==="
        if [ ! -f "dist/index.html" ]; then
          echo "ERROR: dist/index.html not found! Vite build failed."
          exit 1
        fi
        echo "dist/index.html exists"
        ls -la dist/
        echo ""
        echo "=== Checking dist/assets/ ==="
        ls -la dist/assets/ | head -20
        echo ""
        echo "Total renderer files: $(find dist/ -type f | wc -l)"
        echo "Total renderer size: $(du -sh dist/ | cut -f1)"
        echo ""
        echo "=== Checking dist-electron/ (main process) ==="
        if [ ! -f "dist-electron/main.cjs" ]; then
          echo "ERROR: dist-electron/main.cjs not found! Electron build failed."
          exit 1
        fi
        ls -la dist-electron/
        echo ""
        echo "=== Checking release/ (installer) ==="
        ls -la release/ || echo "WARNING: release/ not found"
        echo ""
        echo "=== Verify version in built package.json ==="
        node -e "console.log('Built version:', require('./package.json').version)"
        echo ""
        echo "=== latest.yml content ==="
        cat release/latest.yml || { echo "ERROR: latest.yml not found"; exit 1; }
        echo ""
        echo "=== Validate Windows update artifacts ==="
        node scripts/verify-win-update-artifacts.mjs
        echo ""
        echo "=== CRITICAL: Verify new code is in the built bundle ==="
        if ! grep -ql "ProgressReportBuilder\|createProgressReportSchedule" dist/assets/*.js 2>/dev/null; then
          echo "ERROR: Built bundle does NOT contain ProgressReport code! Build is stale or wrong."
          echo "This would ship old app content. Failing the workflow."
          exit 1
        fi
        echo "OK: Built bundle contains ProgressReport code - fresh build verified."
        echo ""
        echo "=== Verify updater packaging in win-unpacked ==="
        if [ ! -d "release/win-unpacked/resources" ]; then
          echo "ERROR: release/win-unpacked/resources missing"
          exit 1
        fi
        if [ ! -f "release/win-unpacked/resources/app-update.yml" ]; then
          echo "ERROR: resources/app-update.yml missing from win-unpacked"
          exit 1
        fi
        echo "OK: app-update.yml present"
        cat release/win-unpacked/resources/app-update.yml
        if [ -d "release/win-unpacked/resources/app.asar.unpacked/node_modules/electron-updater" ] || \
           [ -d "release/win-unpacked/resources/app/node_modules/electron-updater" ] || \
           find release/win-unpacked -path '*node_modules/electron-updater/package.json' 2>/dev/null | grep -q .; then
          echo "OK: electron-updater found in packaged tree"
        elif [ -f "release/win-unpacked/resources/app.asar" ] && \
             npx --yes asar list release/win-unpacked/resources/app.asar | grep -q 'node_modules/electron-updater/package.json'; then
          echo "OK: electron-updater found inside app.asar"
        else
          echo "ERROR: electron-updater missing from packaged app — would cause updater-unavailable in production"
          exit 1
        fi

    - name: Delete existing release for tag
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ github.ref_name }}
        REPO: ${{ github.repository }}
      run: |
        RELEASE_ID=$(curl -s -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/releases/tags/$TAG" | node -e "let d=require('fs').readFileSync(0,'utf8'); try { const j=JSON.parse(d); console.log(j.id||''); } catch(e) { console.log(''); }")
        if [ -n "$RELEASE_ID" ]; then
          curl -s -X DELETE -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/releases/$RELEASE_ID"
          echo "Deleted existing release for $TAG so new assets can be uploaded."
        else
          echo "No existing release for $TAG."
        fi
      
    - name: Create Release
      # Pin to commit SHA for softprops/action-gh-release@v2
      uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
      with:
        tag_name: ${{ github.ref_name }}
        name: SiteWeave ${{ github.ref_name }}
        files: |
          release/*.exe
          release/*.exe.blockmap
          release/latest.yml
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  mac_release:
    runs-on: macos-latest
    needs: release
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: main
        clean: true
        fetch-depth: 0
        persist-credentials: false

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        cache: ''

    - name: Clean build directories
      shell: bash
      run: |
        rm -rf dist/
        rm -rf dist-electron/
        rm -rf release/
        rm -rf node_modules/.vite

    - name: Install dependencies
      run: npm ci

    - name: Build macOS app
      run: npm run build:mac
      env:
        VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
        VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
        VITE_MICROSOFT_CLIENT_ID: ${{ secrets.VITE_MICROSOFT_CLIENT_ID }}
        VITE_DROPBOX_APP_KEY: ${{ secrets.VITE_DROPBOX_APP_KEY }}
        ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/electron-builder-cache-${{ github.run_id }}

    - name: Upload macOS assets to existing release
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        TAG="${{ github.ref_name }}"
        shopt -s nullglob
        files=(release/*.dmg release/*.zip release/latest-mac.yml)
        if [ ${#files[@]} -eq 0 ]; then
          echo "ERROR: No macOS release assets found in release/"
          exit 1
        fi
        gh release upload "$TAG" "${files[@]}" --clobber
