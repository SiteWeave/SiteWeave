name: Doctors

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  expo-doctor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Expo Doctor
        continue-on-error: true
        run: npx expo-doctor

  react-doctor:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run React Doctor
        # Pin to commit SHA (was @main). Update intentionally when upgrading.
        uses: millionco/react-doctor@359d9b376fce4cbf037be65ec22df9ae444d836a
        with:
          project: apps/mobile,apps/web
          scope: full
          blocking: none
          comment: false
          review-comments: false
          node-version: "22"
