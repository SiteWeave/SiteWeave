directories:
  output: release
  buildResources: store-assets
  app: .
appId: com.siteweave.app
productName: SiteWeave
files:
  - filter:
      - dist-electron/**/*
      - dist/**/*
      - package.json
      # electron-updater is externalized from the Vite main bundle and must ship at runtime.
      - node_modules/electron-updater/**/*
      - node_modules/builder-util-runtime/**/*
      - node_modules/fs-extra/**/*
      - node_modules/js-yaml/**/*
      - node_modules/lazy-val/**/*
      - node_modules/lodash.escaperegexp/**/*
      - node_modules/lodash.isequal/**/*
      - node_modules/semver/**/*
      - node_modules/tiny-typed-emitter/**/*
      - node_modules/argparse/**/*
      - node_modules/debug/**/*
      - node_modules/graceful-fs/**/*
      - node_modules/jsonfile/**/*
      - node_modules/ms/**/*
      - node_modules/sax/**/*
      - node_modules/universalify/**/*
      - '!**/*.map'
      - '!**/*.d.ts'
      - '!**/win-unpacked/**'
      - '!**/.DS_Store'
      - '!**/Thumbs.db'
      - '!apps/**'
win:
  target: nsis
  icon: store-assets/icon.png
  verifyUpdateCodeSignature: false
mac:
  target:
    - dmg
    - zip
  category: public.app-category.productivity
  artifactName: ${productName}-${version}-${arch}.${ext}
# AppX target for MSIX/Store (build with: npm run build:win:appx)
appx:
  applicationId: SiteWeaveLLC.SiteWeave
  displayName: Site Weave
  publisherDisplayName: Site Weave LLC
  identityName: SiteWeaveLLC.SiteWeave
  publisher: CN=068B28E9-7E32-44B0-8497-76E29332ECEA
  backgroundColor: "#000000"
nsis:
  artifactName: ${productName}-Setup-${version}.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
publish:
  provider: github
  owner: SiteWeave
  repo: SiteWeave
electronVersion: 41.2.0
